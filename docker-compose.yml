version: '2'
services:
    webserver:
        image: reviun_co
        ports:
            - '8080:80'
            - '8443:443'
        # volumes:
        #     - ./app:/var/www/html
        environment:
            MYSQL_DB_CONNECTION: test
            MYSQL_DB_NAME: test
            MYSQL_USER: test
            MYSQL_PASSWORD: test
            SITE_URL: http://localhost
            DOCKER_SITE_URL: https://reviun.co/
        networks:
            - prod

networks:
    prod:
        # external: true
