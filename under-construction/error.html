<!DOCTYPE html>
<html>
<head>
  <link rel="icon" type="image/x-icon" href="favicon.png">

<title>Reviun - Under Construction</title>
  
<style>
  body, html {
    height: 100%;
    margin: 0;
    text-shadow: 0px 0px 3px #333;
  }
  
  .bgimg {
    background-image: url('reviun-coming-soon-background.jpg');
    height: 100%;
    background-position: center;
    background-size: cover;
    position: relative;
    color: white;
    font-family: "Courier New", Courier, monospace;
    font-size: 25px;
  }
  
  .topleft {
    position: absolute;
    top: 0;
    left: 16px;
  }
  
  .bottomleft {
    position: absolute;
    bottom: 0;
    left: 16px;
  }
  
  .middle {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  
  .middleBottom {
    position: absolute;
    bottom: 5%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  
  
  hr {
    margin: auto;
    width: 40%;
  }
  </style>
</head>


<body>

<div class="bgimg">
  <div class="topleft">
    <p><img src="reviun-logo.png" style="max-width: 200px;"/></p>
  </div>
  <div class="middle">
    <h1>WE ARE COMING SOON</h1>
    <hr>
    <p>only few days left...</p>
  </div>
  <div class="middleBottom">
    <p>Some Error! Please Visit Home Page</p>
  </div>
</div>

</body>
</html>
